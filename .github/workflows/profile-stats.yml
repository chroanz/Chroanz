name: Update profile stats

on:
  schedule:
    - cron: "17 6 * * *" # daily, 03:17 in Brazil (UTC-3)
  workflow_dispatch: # run manually from the Actions tab
  push:
    branches: [main, master]
    paths:
      - "scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate SVG cards
        env:
          # Personal access token (read-only) so private repos are counted too.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: python scripts/generate_stats.py --out assets

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore: update profile stats [skip ci]"
            git push
          fi
